
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conchon Burguer</title>

    <!-- CSS de la portada -->
    <link rel="stylesheet" href="Estilos/estilo.css">
</head>

<body>

    <!-- ============================= -->
    <!-- PANTALLA DE PRESENTACIÓN -->
    <!-- ============================= -->

    <section id="presentacion">

        <!-- Figuras grandes -->
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>

        <!-- Cuadraditos -->
        <div class="rombo rombo-1"></div>
        <div class="rombo rombo-2"></div>
        <div class="rombo rombo-3"></div>
        <div class="rombo rombo-4"></div>
        <div class="rombo rombo-5"></div>
        <div class="rombo rombo-6"></div>
        <div class="rombo rombo-7"></div>

        <!-- Puntos -->
        <div class="dots dots-1"></div>
        <div class="dots dots-2"></div>
        <div class="dots dots-3"></div>

        <!-- Líneas del fondo -->
        <div class="linea linea-1"></div>
        <div class="linea linea-2"></div>

        <!-- Decoración -->
        <div class="decoracion decoracion-1"></div>
        <div class="decoracion decoracion-2"></div>

        <!-- Cuadrados pequeños -->
        <div class="mini mini-1"></div>
        <div class="mini mini-2"></div>
        <div class="mini mini-3"></div>
        <div class="mini mini-4"></div>

        <!-- Rayas -->
        <div class="rayas rayas-1"></div>
        <div class="rayas rayas-2"></div>

        <!-- ============================= -->
        <!-- CONTENIDO CENTRAL -->
        <!-- ============================= -->

        <div class="contenido">

            <!-- Logo -->
            <div class="logo">
                <div class="pan"></div>
                <div class="carne"></div>
                <div class="queso"></div>
                <div class="pan-abajo"></div>
            </div>

            <!-- Nombre -->
            <h1>
                <span>CONCHON</span>
                <b>BURGUER</b>
            </h1>

            <!-- Estrellas -->
            <div class="separador">
                <div class="linea-roja"></div>

                <div class="estrellas">
                    ★ ★ ★ ★ ★
                </div>

                <div class="linea-roja"></div>
            </div>

            <!-- Eslogan -->
            <p>SABOR QUE TE CONQUISTA</p>

            <!-- Botón -->
            <button id="btnEntrar" type="button">
                ENTRAR
            </button>

        </div>

    </section>

    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->
      
<!-- JavaScript de la introducción de video -->
<script src="JS/intro3d.js"></script>

<!-- JavaScript original de la portada -->
<script src="JS/script.js"></script>

</body>
</html>
